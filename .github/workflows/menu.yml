name: Update mensa menu

on:
  schedule:
    # Runs at 06:00 UTC (08:00 Berlin time) every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write  # needed so the workflow can commit menu.json back to the repo

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run menu script
        run: python mensa_menu.py

      - name: Commit updated menu.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add menu.json menu.png
          git diff --staged --quiet || git commit -m "Update menu.json"
          git push
